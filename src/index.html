<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>INXENUITY | Multimodal AI Architecture for Enterprise</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="INXENUITY delivers production-grade multimodal AI architectures engineered for real-time deployment across cloud, edge, robotics, and digital twins.">
  <meta name="theme-color" content="#07090e">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('inx_theme');
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersLight ? 'light' : 'dark');
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.add('light-theme');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body class="bg-primary text-primary antialiased selection:bg-cyan-500 selection:text-white">
  <app-root></app-root>
</body>
</html>
